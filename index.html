    :root{color-scheme:dark;--bg:#11141b;--panel:#1b202b;--line:#323947;--text:#f8f9fb;--muted:#aeb5c2;--yellow:#ffb400;--yellow-2:#ffc63b}
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;background:radial-gradient(circle at 15% 0,#242b39 0,transparent 34%),var(--bg);color:var(--text);font-family:Arial,sans-serif}
    button,input,textarea{font:inherit}
    .app{width:min(1120px,100%);margin:auto;padding:18px 16px 30px}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .brand{display:flex;align-items:center;gap:10px;font:700 1.35rem Tungsten,Arial Narrow,sans-serif;letter-spacing:.08em}
    .brand-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--yellow);color:#161a22;font-weight:800}
    .tag{font-size:.78rem;color:var(--muted)}
    .workspace{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:18px;align-items:start}
    .panel,.preview-card{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 55px #0005}
    .panel{padding:18px}
    .panel h1{font:700 2rem/1 Tungsten,Arial Narrow,sans-serif;margin:0 0 6px;text-transform:uppercase;letter-spacing:.02em}
    .help{color:var(--muted);font-size:.9rem;line-height:1.4;margin:0 0 18px}
    .field{display:block;margin-top:14px}
    .field span{display:flex;justify-content:space-between;color:#dfe3ea;font-size:.86rem;font-weight:700;margin:0 0 7px}
    .field small{color:#737d8d;font-weight:400}
    textarea,input{width:100%;border:1px solid #3a4251;background:#121720;color:white;border-radius:12px;padding:12px 13px;outline:none;transition:.18s border-color,.18s box-shadow}
    textarea{resize:vertical;min-height:80px;line-height:1.3;text-transform:uppercase}
    textarea:focus,input:focus{border-color:var(--yellow);box-shadow:0 0 0 3px #ffb40025}
    .highlight-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
    .highlight-button,.clear-highlight{border:1px solid #3a4251;border-radius:10px;padding:10px 12px;font-size:.84rem;font-weight:800;cursor:pointer}
    .highlight-button{background:#ffb400;color:#151920;border-color:#ffb400}
    .clear-highlight{background:#252b37;color:#eef1f5}
    .highlight-note{display:block;margin-top:7px;color:var(--muted);font-size:.78rem;line-height:1.35}
    .date-row{display:grid;grid-template-columns:1fr auto;gap:8px}
    .today{border:1px solid #3a4251;background:#252b37;color:white;border-radius:12px;padding:0 13px;font-weight:700;cursor:pointer}
    .actions{display:grid;grid-template-columns:1fr;gap:9px;margin-top:18px}
    .download{border:0;border-radius:13px;padding:14px 18px;background:linear-gradient(135deg,var(--yellow-2),var(--yellow));color:#151920;font-weight:800;cursor:pointer;box-shadow:0 9px 24px #ffb4002e}
    .download:active,.today:active{transform:translateY(1px)}
    .status{min-height:18px;margin:9px 2px 0;color:var(--muted);font-size:.8rem;text-align:center}
    .preview-card{padding:14px}
    .preview-head{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px;color:var(--muted);font-size:.82rem}
    .ratio{aspect-ratio:4/5;width:100%;overflow:hidden;border-radius:12px;background:#20242e;box-shadow:0 10px 30px #0007}
    canvas{display:block;width:100%;height:100%}
    @media(max-width:760px){.app{padding:12px 12px 28px}.workspace{grid-template-columns:1fr}.preview-card{order:-1;padding:9px}.ratio{max-height:52dvh;width:auto;margin:auto}.panel{padding:16px}.topbar{margin-bottom:10px}.tag{display:none}.preview-head{margin:0 2px 7px}.panel h1{font-size:1.35rem}.help{margin-bottom:12px}.field{margin-top:11px}}
  </style>
</head>

  <main class="app">
    <header class="topbar">

    <section class="workspace">
      <form class="panel" id="editor">

        </label>
        <div class="highlight-tools" aria-label="Turuncu vurgu ayarı">
          <button class="highlight-button" id="setHighlightButton" type="button">SEÇİMİ TURUNCU YAP</button>
          <button class="clear-highlight" id="clearHighlightButton" type="button">VURGUYU KALDIR</button>

    let savedSelection={start:36,end:64};
    let highlight={start:36,end:64};
    const upper=s=>(s||'').toLocaleUpperCase('tr-TR');
    function wordsFrom(text){const out=[];for(const m of text.matchAll(/\S+/g))out.push({text:m[0],start:m.index,end:m.index+m[0].length});return out}
    function partition(words,lineCount,targetWidth,fontSize){
      const n=words.length,dp=Array.from({length:n+1},()=>Array(lineCount+1).fill(null));dp[0][0]={score:0,parts:[]};
      ctx.font=`700 ${fontSize}px Tungsten, Arial Narrow, sans-serif`;
      for(let end=1;end<=n;end++)for(let lines=1;lines<=lineCount;lines++)for(let start=lines-1;start<end;start++){
        const prev=dp[start][lines-1];if(!prev)continue;
        const text=words.slice(start,end).map(w=>w.text).join(' '),width=ctx.measureText(text).width;
        const ratio=targetWidth/Math.max(width,1);let penalty=Math.pow(Math.log(Math.max(.01,ratio)),2);
        if(ratio>1.85||ratio<.62)penalty+=8;
        if(end-start===1&&words[start].text.length<4)penalty+=2.5;
        const score=prev.score+penalty;if(!dp[end][lines]||score<dp[end][lines].score)dp[end][lines]={score,parts:[...prev.parts,[start,end]]};
      }
      return dp[n][lineCount];
    }
    function layoutHeadline(text,maxWidth,maxHeight){
      const words=wordsFrom(text);if(!words.length)return{words:[],parts:[],fontSize:110,lineHeight:88};
      const desired=Math.max(2,Math.min(7,Math.round(text.replace(/\s/g,'').length/8.5)));
      let best=null;
      for(let count=Math.max(1,desired-1);count<=Math.min(words.length,desired+1);count++){

        if(!best||score<best.score)best={score,words,parts:candidate.parts,fontSize,lineHeight:fontSize*.92};
      }
      return best||{words,parts:[[0,words.length]],fontSize:100,lineHeight:92};
    }
    function drawEqualLine(lineWords,x,y,maxWidth,fontSize){

    }

      ctx.fillStyle='#20242e';ctx.fillRect(0,0,1080,1350);
      if(portrait.complete&&portrait.naturalWidth)ctx.drawImage(portrait,0,0,532,1350);
      const fade=ctx.createLinearGradient(500,0,565,0);fade.addColorStop(0,'rgba(32,36,46,0)');fade.addColorStop(1,'#20242e');ctx.fillStyle=fade;ctx.fillRect(500,0,66,1350);
      const x=553,w=494,y=128;
      const headline=layoutHeadline(upper(headlineText.value),w,650);
      headline.parts.forEach((part,i)=>drawEqualLine(headline.words.slice(part[0],part[1]),x,y+i*headline.lineHeight,w,headline.fontSize));
      ctx.fillStyle='#f3f3f1';ctx.font='500 52px MadeTommyMedium, Arial, sans-serif';ctx.textAlign='center';ctx.textBaseline='top';
      ctx.fillText('Hüseyin Ekmekçi',800,900);
      if(logo.complete&&logo.naturalWidth){ctx.save();roundRect(900,1044,140,140,20);ctx.clip();ctx.drawImage(logo,900,1044,140,140);ctx.restore()}
      ctx.textAlign='left';
      document.querySelector('#headlineCount').textContent=`${headlineText.value.length}/180`;
    }
    async function ready(){try{await document.fonts.ready}catch{} render()}
    portrait.onload=ready;logo.onload=ready;ready();
    function rememberSelection(){if(headlineText.selectionEnd>headlineText.selectionStart)savedSelection={start:headlineText.selectionStart,end:headlineText.selectionEnd}}
    ['select','keyup','mouseup','touchend'].forEach(type=>headlineText.addEventListener(type,rememberSelection));
    headlineText.addEventListener('input',()=>{highlight=null;document.querySelector('#highlightNote').textContent='Turuncu vurgu yok';render()});
    const setHighlightButton=document.querySelector('#setHighlightButton');
    setHighlightButton.addEventListener('mousedown',e=>e.preventDefault());
    setHighlightButton.addEventListener('click',()=>{rememberSelection();if(savedSelection.end<=savedSelection.start){statusEl.textContent='Önce başlık içinden turuncu olacak kelimeleri seçin.';return}highlight={...savedSelection};const selected=headlineText.value.slice(highlight.start,highlight.end).trim();if(!selected){statusEl.textContent='Geçerli bir kelime seçin.';return}document.querySelector('#highlightNote').textContent=`Turuncu: ${upper(selected)}`;statusEl.textContent='Turuncu vurgu ayarlandı.';render()});
    document.querySelector('#clearHighlightButton').addEventListener('click',()=>{highlight=null;document.querySelector('#highlightNote').textContent='Turuncu vurgu yok';statusEl.textContent='Turuncu vurgu kaldırıldı.';render()});
    document.querySelector('#downloadButton').addEventListener('click',()=>{render();canvas.toBlob(blob=>{if(!blob)return;const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`haber-kibris-${new Date().toISOString().slice(0,10)}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);statusEl.textContent='Görsel hazırlandı. iPhone’da resmi basılı tutup Fotoğraflar’a kaydedebilirsiniz.'},'image/png')});
    (function registerWebMCP(){const mc=document.modelContext;if(!mc?.registerTool)return;try{mc.registerTool({name:'set_visual_text',title:'Görsel metnini ayarla',description:'Haber Kıbrıs görselindeki tek başlığı ve isteğe bağlı turuncu vurgu aralığını ayarlar.',inputSchema:{type:'object',properties:{headline:{type:'string',maxLength:180},highlight_text:{type:'string',maxLength:100}},required:['headline'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){if(!input||typeof input.headline!=='string')throw new Error('Geçersiz metin alanı');headlineText.value=input.headline.slice(0,180);const needle=input.highlight_text||'';const start=headlineText.value.toLocaleUpperCase('tr-TR').indexOf(needle.toLocaleUpperCase('tr-TR'));highlight=start>=0&&needle?{start,end:start+needle.length}:null;document.querySelector('#highlightNote').textContent=highlight?`Turuncu: ${upper(needle)}`:'Turuncu vurgu yok';render();return{updated:true,headline:headlineText.value,highlight_text:highlight?needle:''}}})}catch{}})();
